name: Build VSIX

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: databricks-aigw-models.vsix
          path: databricks-aigw-models.vsix
